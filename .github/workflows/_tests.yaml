on:
  workflow_call: {}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18.x, 20.x, 22.x, 24.x, 26.x ]
      fail-fast: false

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: install and build
        run: |
          sudo apt-get update
          sudo apt-get install expect
          npm ci && npm run build
      - name: lint and test
        run: |
          [[ $(node -v | cut -d. -f1 | tr -d 'v') -ge 20 ]] && npm run lint
          npm run coverage
      - name: test dist
        run: |
          rm -rf node_modules
          npm ci --omit=dev
          npm run test:dist

  commpattest:
    name: Run command compatibility tests
    runs-on: ubuntu-latest
    container: node:${{ matrix.node-version }}-slim
    strategy:
      matrix:
        node-version: [ 22, 24, 26 ]
      fail-fast: false

    steps:
      - name: Install command-line tools
        run: |
          apt-get update
          apt-get install --no-install-recommends -y git ca-certificates expect iputils-ping traceroute dnsutils mtr-tiny
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Log compatibility environment
        run: |
          cat /etc/os-release
          node --version
          npm --version
          dpkg-query --show --showformat='${Package} ${Version}\n' ca-certificates expect iputils-ping traceroute dnsutils bind9-dnsutils mtr-tiny
          expect -v
          ping -V
          traceroute --version
          dig -v
          mtr --version
      - name: Test command compatibility
        run: npm run test:compat

  e2etest:
    name: Run e2e tests
    runs-on: ubicloud-standard-4
    strategy:
      matrix:
        node-version: [ 22.x ]

    env:
      NODE_ENV: test

    services:
      mariadb:
        image: mariadb:11.8.6
        ports:
          - 13306:3306
        env:
          MARIADB_DATABASE: dashboard-globalping-test
          MARIADB_USER: directus
          MARIADB_PASSWORD: password
          MARIADB_RANDOM_ROOT_PASSWORD: 1
        options: >-
          --health-cmd "mariadb-admin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgresMeasurementStore:
        image: timescale/timescaledb:2.25.2-pg18
        ports:
          - 15432:5432
        env:
          POSTGRES_DB: globalping-measurement-store-1-test
          POSTGRES_USER: globalping-api
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd "pg_isready -U globalping-api"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgresTimeSeries:
        image: timescale/timescaledb:2.26.4-pg18
        ports:
          - 15442:5432
        env:
          POSTGRES_DB: globalping-time-series-1-test
          POSTGRES_USER: globalping-api
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd "pg_isready -U globalping-api"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: ubicloud/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Enable IPv6 for Docker containers
        run: |
          sudo cat /etc/docker/daemon.json | jq '. + { "ipv6": true, "fixed-cidr-v6": "2001:db8:1::/64", "experimental": true, "ip6tables": true }' > daemon.json
          sudo mv daemon.json /etc/docker/
          sudo systemctl restart docker
          docker restart $(docker ps -aq)
      - name: Set up Redis
        env:
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Current branch: $CURRENT_BRANCH."
          npm run test:e2e:clone
          cd test/e2e/globalping
          cp config/redis/.env.redis ./
          docker compose up -d
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Test E2E
        run: |
          npm run test:e2e:docker
          npm run test:e2e:run
